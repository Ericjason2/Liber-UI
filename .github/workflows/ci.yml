name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate resource schemas
        run: pnpm validate

      - name: Run code generation pipeline
        run: pnpm generate

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: ESLint check
        run: pnpm lint

      - name: Unit & bundle tests
        run: pnpm test

      - name: Build Next.js production app
        run: pnpm build
